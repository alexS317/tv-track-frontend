<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="px-4">TV Track</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">TV Track</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="flex h-full flex-col items-center justify-center p-4">
    <form
      class="flex flex-col gap-4 rounded-md p-6 md:w-1/2 xl:w-1/3"
      [formGroup]="form"
      (ngSubmit)="onRegister()"
    >
      <ion-input
        type="text"
        label="Your name"
        labelPlacement="floating"
        [required]="true"
        maxlength="255"
        errorText="Name is required."
        fill="outline"
        formControlName="name"
      ></ion-input>

      <ion-input
        type="email"
        label="Email"
        labelPlacement="floating"
        placeholder="name@example.com"
        [required]="true"
        maxlength="255"
        errorText="Enter a valid email."
        fill="outline"
        formControlName="email"
      ></ion-input>

      <ion-input
        type="password"
        label="Password"
        labelPlacement="floating"
        [required]="true"
        errorText="Password must have at least 8 characters."
        minlength="8"
        maxlength="72"
        fill="outline"
        formControlName="password"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-input
        type="password"
        label="Password confirmation"
        labelPlacement="floating"
        [required]="true"
        errorText="Must be identical to the password."
        minlength="8"
        maxlength="72"
        fill="outline"
        formControlName="passwordConfirmation"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <ion-button type="submit">Register</ion-button>
    </form>
  </div>
</ion-content>
