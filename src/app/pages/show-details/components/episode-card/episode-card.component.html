<div class="flex flex-col gap-3">
  <div class="flex flex-row items-start gap-3">
    @if (episode().image) {
      <img
        class="aspect-16/9 w-2/5 max-w-[250px] basis-2/5 object-contain md:w-auto md:basis-auto"
        [ngSrc]="episode().image!"
        alt=""
        width="250"
        height="140"
        loading="lazy"
      />
    } @else {
      <div
        class="img-fallback flex aspect-16/9 w-2/5 max-w-[250px] items-center justify-center p-2"
      >
        <p class="text-center">No cover image available.</p>
      </div>
    }
    <div class="flex basis-3/5 flex-col">
      @if (currentlyWatching()) {
        <ion-text class="text-lg font-semibold uppercase" color="primary"
          >Currently Watching</ion-text
        >
      }
      <ion-text class="text-xl font-semibold">{{ episode().name }}</ion-text>
      <ion-text>{{ episode().runtime }} min</ion-text>
    </div>
  </div>
  <ion-text class="summary" [innerHTML]="episode().summary"></ion-text>
</div>
