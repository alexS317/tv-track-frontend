<div class="flex flex-col gap-3">
  <div class="flex flex-row items-start gap-3">
    <app-image-fallback
      [imageSrc]="episode().image"
      [fullSrc]="true"
      format="landscape"
      imageClasses="aspect-16/9 w-2/5 max-w-[250px] basis-2/5 object-contain md:w-auto md:basis-auto"
      fallbackClasses="aspect-16/9 w-2/5 max-w-[250px]"
    ></app-image-fallback>

    <div class="flex basis-3/5 flex-col">
      @if (currentlyWatching()) {
        <ion-text class="text-lg font-semibold uppercase" color="primary"
          >Currently Watching</ion-text
        >
      }
      <ion-text class="text-xl font-semibold">{{ episode().name }}</ion-text>
      <ion-text class="text-(--ion-text-color-step-400)"
        >Episode {{ episode().number }} | {{ episode().runtime }} min</ion-text
      >
    </div>
  </div>
  <ion-text class="summary" [innerHTML]="episode().summary"></ion-text>
</div>
