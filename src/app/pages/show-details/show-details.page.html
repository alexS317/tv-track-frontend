<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons>
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="flex flex-col gap-6 p-4">
    <div class="flex flex-row gap-4">
      <img
        class="w-2/5 md:w-auto"
        [ngSrc]="`https://static.tvmaze.com/uploads/images/medium_portrait/${showDetails().coverImage}`"
        width="210"
        height="295"
        [priority]="true"
        alt=""
      />
      <div class="flex flex-col">
        <ion-text class="text-2xl font-bold">{{ showDetails().title }}</ion-text>
      </div>
    </div>
    <app-personal-statistics [showDetails]="showDetails()"></app-personal-statistics>
  </div>
</ion-content>
