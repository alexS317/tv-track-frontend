<ion-menu contentId="main">
  <ion-header>
    <ion-toolbar>
      <div class="flex flex-row items-center gap-2 px-4">
        <ion-icon name="film" size="large"></ion-icon>
        <ion-title>TV Track</ion-title>
      </div>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <div class="flex flex-col justify-between p-1">
      <ion-list lines="none">
        @for (item of menuItems; track $index) {
          <ion-item class="py-1" [button]="true" [detail]="false" (click)="onFilter(item.status)">
            <ion-icon [name]="item.icon" size="large"> </ion-icon>
            <ion-label class="px-3">
              <ion-text class="text-lg capitalize">{{ item.label }}</ion-text>
            </ion-label>
          </ion-item>
        }
      </ion-list>
    </div>
  </ion-content>

  <ion-footer>
    <ion-toolbar>
      <div class="flex flex-row items-center justify-center gap-2 py-4">
        <ion-icon name="sunny" size="large"></ion-icon>
        <ion-toggle [checked]="isDark()" (ionChange)="onToggle($event)"></ion-toggle>
        <ion-icon name="moon" size="large"></ion-icon>
      </div>
      <ion-buttons class="flex flex-row justify-center pb-2">
        <ion-button (click)="onResetToSystemTheme()">Reset to system preferences</ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-footer>
</ion-menu>
